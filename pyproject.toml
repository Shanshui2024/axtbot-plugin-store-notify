[project]
name = "axtbot-plugin-store-notify"
version = "1.0.2"
description = "AxTBot 插件商店通知：接收 GitHub Webhook 并推送审核消息到指定 QQ 群"
authors = [
    {name = "Shanshui2024", email = "shanshui@shanshui.site"},
]
dependencies = [
    "aiohttp>=3.9",
    "fastapi>=0.100",
]
requires-python = ">=3.11"
readme = "README.md"
keywords = ["axtbot", "plugin", "qq", "github", "webhook", "store"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/Shanshui2024/axtbot-plugin-store-notify"
Source = "https://github.com/Shanshui2024/axtbot-plugin-store-notify"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["src"]

[tool.pdm.dev-dependencies]
dev = [
    "black>=24.4.2",
    "isort>=5.13.2"
]

[tool.pdm.scripts]
format = { composite = ["isort . ", "black . "] }

[tool.black]
line-length = 90
target-version = ["py39", "py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 90
length_sort = true
skip_gitignore = true
force_sort_within_sections = true

[project.entry-points."axtbot.plugins"]
store-notify = "axtbot_plugin_store_notify:__meta__"
